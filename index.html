<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Gudang Online Real-Time</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --p: #2563eb; --s: #16a34a; --d: #dc2626; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .box { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .section { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .grid { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
        input, select, button { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        button { cursor: pointer; background: var(--p); color: white; border: none; font-weight: bold; }
        .tab-btn { padding: 10px 20px; border: none; background: #cbd5e1; cursor: pointer; border-radius: 8px 8px 0 0; }
        .tab-btn.active { background: var(--p); color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background: #f8fafc; }
        .badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; color: white; font-weight: bold; }
        .masuk { background: var(--s); }
        .keluar { background: var(--d); }
        .hidden { display: none !important; }
        .status-online { font-size: 12px; color: #16a34a; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>📦 Management Stok Online</h2>
        <span id="netStatus" style="font-size:12px; color:orange;">Connecting...</span>
    </div>

    <div style="margin-bottom: -1px;">
        <button id="t1" class="tab-btn active" onclick="switchTab(1)">Stok & Input</button>
        <button id="t2" class="tab-btn" onclick="switchTab(2)">Riwayat Transaksi</button>
        <button id="t3" class="tab-btn" onclick="switchTab(3)">Rekap Bulanan</button>
    </div>

    <div id="c1" class="section" style="border-radius:0 8px 8px 8px; border-top:2px solid var(--p);">
        <div style="background:white; padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid var(--p);">
            <h4 style="margin:0 0 10px 0">📊 Sisa Stok Saat Ini</h4>
            <table id="stokTable">
                <thead><tr><th>Nama Barang</th><th>Total Masuk</th><th>Total Keluar</th><th>Sisa</th></tr></thead>
                <tbody id="stokBody"></tbody>
            </table>
        </div>

        <h4>📝 Input Transaksi Baru</h4>
        <div class="grid">
            <div class="field">
                <label>Tipe</label>
                <select id="tipe" onchange="toggleInput()">
                    <option value="MASUK">MASUK (+)</option>
                    <option value="KELUAR">KELUAR (-)</option>
                </select>
            </div>
            
            <div class="field" id="divM">
                <label>Pilih Barang Masuk</label>
                <select id="namaM">
                    <option value="" disabled selected>-- Pilih Barang --</option>
                    <option value="ALCOHOL SWAB">Alcohol Swab</option>
                    <option value="BETADINE">Betadine</option>
                    <option value="KERTAS EKG">Kertas EKG</option>
                    <option value="BACTIGRAS">Bactigras</option>
                    <option value="HYPAFIX">Hypafix</option>
                    <option value="JELLY">Jelly</option>
                    <option value="TISU HALUS">Tisu Halus</option>
                    <option value="TISU KASAR">Tisu Kasar</option>
                    <option value="KLIP OBAT">Klip Obat</option>
                    <option value="HANDSCOON S">Handscoon S</option>
                    <option value="HANDSCOON M">Handscoon M</option>
                    <option value="MASKER">Masker</option>
                    <option value="BUKU POLIO/OPERAN">Buku Polio/Operan</option>
                    <option value="BUKU TTV">Buku TTV</option>
                    <option value="BUKU VISITE">Buku Visite</option>
                    <option value="SPIDOL">Spidol</option>
                    <option value="BATERAI A2">Baterai A2</option>
                    <option value="BATERAI A3">Baterai A3</option>
                    <option value="BATERAI BULAT KECIL">Baterai Bulat Kecil</option>
                    <option value="BATERAI BULAT BESAR">Baterai Bulat Besar</option>
                    <option value="KASA GULUNG">Kasa Gulung</option>
                    <option value="KAIN BATIK">Kain Batik</option>
                    <option value="PULPEN">Pulpen</option>
                    <option value="STIKER BARCODE">Stiker Barcode</option>
                    <option value="TINTA PRINTER MERAH">Tinta Printer Merah</option>
                    <option value="TINTA PRINTER BIRU">Tinta Printer Biru</option>
                    <option value="TINTA PRINTER KUNING">Tinta Printer Kuning</option>
                    <option value="TINTA PRINTER HITAM">Tinta Printer Hitam</option>
                    <option value="STAPLER">Stapler</option>
                    <option value="STABILO">Stabilo</option>
                    <option value="TIPE-X">Tipe-X</option>
                </select>
            </div>

            <div class="field hidden" id="divK">
                <label>Pilih Barang Keluar</label>
                <select id="namaK"></select>
            </div>
            <div class="field">
                <label>Jumlah</label>
                <input type="number" id="qty" placeholder="0">
            </div>
            <button onclick="simpanKeCloud()">SIMPAN KE CLOUD</button>
        </div>
    </div>

    <div id="c2" class="section hidden" style="border-radius:0 8px 8px 8px; border-top:2px solid var(--p);">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4>📜 Daftar Transaksi Terakhir (Maks. 100)</h4>
            <button onclick="tutupBuku()" style="background: #4b5563; font-size: 11px; padding: 5px 10px;">🔒 Tutup Buku (Reset Database)</button>
        </div>
        <table id="historyTable">
            <thead><tr><th>Waktu</th><th>Barang</th><th>Tipe</th><th>Qty</th><th>Aksi</th></tr></thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <div id="c3" class="section hidden" style="border-radius:0 8px 8px 8px; border-top:2px solid var(--p);">
        <h4>🗓️ Laporan Bulanan</h4>
        <div class="grid" style="margin-bottom:15px;">
            <div class="field">
                <label>Pilih Bulan</label>
                <input type="month" id="filterBulan" onchange="renderRekap()">
            </div>
            <button onclick="eksporExcel()" style="background:var(--s)">📥 Ekspor Rekap (.csv)</button>
        </div>
        <table id="rekapTable">
            <thead><tr><th>Nama Barang</th><th>Masuk</th><th>Keluar</th><th>Sisa Akhir</th></tr></thead>
            <tbody id="rekapBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- KONFIGURASI FIREBASE ANDA ---
    const firebaseConfig = {
        apiKey: "AIzaSyBZXj5bYhzN1jfYO4lY1Tsqps0gRMffWIM",
        authDomain: "stok-barang-ranap-2.firebaseapp.com",
        databaseURL: "https://stok-barang-ranap-2-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "stok-barang-ranap-2",
        storageBucket: "stok-barang-ranap-2.firebasestorage.app",
        messagingSenderId: "567054436342",
        appId: "1:567054436342:web:4a8e1c03b7ef154859a9d7",
        measurementId: "G-VXER1T1E4E"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('stok_global');

    function switchTab(n) {
        document.getElementById('c1').classList.add('hidden');
        document.getElementById('c2').classList.add('hidden');
        document.getElementById('c3').classList.add('hidden');
        document.getElementById('t1').classList.remove('active');
        document.getElementById('t2').classList.remove('active');
        document.getElementById('t3').classList.remove('active');
        document.getElementById('c' + n).classList.remove('hidden');
        document.getElementById('t' + n).classList.add('active');

        if(n === 3) {
            const now = new Date();
            if(!document.getElementById('filterBulan').value) {
                document.getElementById('filterBulan').value = now.toISOString().substring(0, 7);
            }
            renderRekap();
        }
    }

    function toggleInput() {
        const tipe = document.getElementById('tipe').value;
        document.getElementById('divM').classList.toggle('hidden', tipe === 'KELUAR');
        document.getElementById('divK').classList.toggle('hidden', tipe === 'MASUK');
    }

    let globalData = [];
    dbRef.limitToLast(100).on('value', (snap) => {
        document.getElementById('netStatus').innerText = "● Online (Optimized)";
        document.getElementById('netStatus').style.color = "#16a34a";
        const val = snap.val();
        globalData = val ? Object.keys(val).map(k => ({...val[k], id: k})) : [];
        renderAll();
    });

    function simpanKeCloud() {
        const tipe = document.getElementById('tipe').value;
        const qty = parseInt(document.getElementById('qty').value);
        let nama = (tipe === 'MASUK') ? document.getElementById('namaM').value : document.getElementById('namaK').value;

        if(!nama || isNaN(qty) || qty <= 0) return alert("Mohon pilih barang dan isi jumlah dengan benar!");
        
        const now = new Date();
        dbRef.push({
            nama: nama,
            tipe: tipe,
            qty: qty,
            waktu: now.toLocaleString('id-ID'),
            bulan: now.toISOString().substring(0, 7)
        }).then(() => {
            alert("Data Berhasil Disimpan!");
        });

        document.getElementById('qty').value = '';
    }

    function renderAll() {
        const sBody = document.getElementById('stokBody');
        const hBody = document.getElementById('historyBody');
        const selK = document.getElementById('namaK');
        sBody.innerHTML = ''; hBody.innerHTML = ''; selK.innerHTML = '';
        
        const ringkasan = {};
        const dataUrut = [...globalData].reverse();

        dataUrut.forEach(i => {
            hBody.innerHTML += `<tr>
                <td>${i.waktu}</td>
                <td>${i.nama}</td>
                <td><span class="badge ${i.tipe.toLowerCase()}">${i.tipe}</span></td>
                <td>${i.qty}</td>
                <td><button onclick="hapus('${i.id}')" style="background:red; border:none; color:white; padding:3px 6px; border-radius:4px; cursor:pointer;">Hapus</button></td>
            </tr>`;
            
            if(!ringkasan[i.nama]) ringkasan[i.nama] = {m:0, k:0};
            if(i.tipe === 'MASUK') ringkasan[i.nama].m += i.qty;
            else ringkasan[i.nama].k += i.qty;
        });

        for(let n in ringkasan) {
            let sisa = ringkasan[n].m - ringkasan[n].k;
            sBody.innerHTML += `<tr><td>${n}</td><td>${ringkasan[n].m}</td><td>${ringkasan[n].k}</td><td><b>${sisa}</b></td></tr>`;
            if(sisa > 0) selK.innerHTML += `<option value="${n}">${n} (Stok: ${sisa})</option>`;
        }
    }

    function renderRekap() {
        const bln = document.getElementById('filterBulan').value;
        const rBody = document.getElementById('rekapBody');
        rBody.innerHTML = '<tr><td colspan="4">Memuat data rekap...</td></tr>';

        dbRef.orderByChild('bulan').equalTo(bln).once('value', (snap) => {
            rBody.innerHTML = '';
            const rekapData = snap.val();
            if (!rekapData) {
                rBody.innerHTML = '<tr><td colspan="4">Tidak ada data di bulan ini.</td></tr>';
                return;
            }
            const rekap = {};
            Object.values(rekapData).forEach(i => {
                if(!rekap[i.nama]) rekap[i.nama] = {m:0, k:0};
                if(i.tipe === 'MASUK') rekap[i.nama].m += i.qty;
                else rekap[i.nama].k += i.qty;
            });
            for(let n in rekap) {
                rBody.innerHTML += `<tr><td>${n}</td><td style="color:green">+${rekap[n].m}</td><td style="color:red">-${rekap[n].k}</td><td><b>${rekap[n].m - rekap[n].k}</b></td></tr>`;
            }
        });
    }

    function eksporExcel() {
        const bln = document.getElementById('filterBulan').value;
        let csv = `Rekap Laporan Bulan: ${bln}\nNama Barang,Masuk,Keluar,Sisa\n`;
        const rows = document.querySelectorAll('#rekapBody tr');
        rows.forEach(r => {
            const cols = r.querySelectorAll('td');
            if(cols.length > 1) csv += `${cols[0].innerText},${cols[1].innerText},${cols[2].innerText},${cols[3].innerText}\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Rekap_Gudang_${bln}.csv`;
        link.click();
    }

    function tutupBuku() {
        if(confirm("PERHATIAN: Fitur ini akan mengunduh BACKUP dan MENGHAPUS semua data di Cloud untuk memulai bulan baru. Lanjutkan?")) {
            let csv = "BACKUP GLOBAL GUDANG\nWaktu,Barang,Tipe,Qty\n";
            dbRef.once('value', (snap) => {
                const data = snap.val();
                if(data) {
                    Object.values(data).forEach(i => { csv += `${i.waktu},${i.nama},${i.tipe},${i.qty}\n`; });
                    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = `BACKUP_FULL_${new Date().toLocaleDateString()}.csv`;
                    link.click();
                    
                    setTimeout(() => { dbRef.remove(); alert("Database dibersihkan!"); }, 1000);
                }
            });
        }
    }

    function hapus(id) {
        if(confirm("Hapus transaksi ini?")) firebase.database().ref('stok_global/' + id).remove();
    }
</script>
</body>
</html>
